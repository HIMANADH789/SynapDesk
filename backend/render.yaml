services:
  - type: web
    name: rag-fastapi-backend
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: WORKERS
        value: "1"
      - key: MONGODB_URI
        sync: false  # You will enter this manually in Render dashboard for security
      - key: DB_NAME
        value: "rag_db"
